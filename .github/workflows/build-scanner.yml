name: Build scanner EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop-client/**"
      - ".github/workflows/build-scanner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dngscanner.exe
        shell: cmd
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          DNG_API_URL: ${{ vars.DNG_API_URL || 'https://test-v7a8.onrender.com' }}
          DNG_ALLOW_DEFAULT_API: "1"
        run: |
          cd desktop-client
          call build-secure-exe.bat

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: dngscanner-exe
          path: desktop-client/dist-secure/dngscanner.exe
          if-no-files-found: error

      - name: Publish rolling scanner release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scanner-latest
          name: DangerousCity Scanner (latest build)
          files: desktop-client/dist-secure/dngscanner.exe
          make_latest: true
          overwrite: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
