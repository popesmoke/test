# Render Blueprint — Virello Secure API
# Connect this repo on Render and apply the blueprint, or keep the existing
# service start command: python server.py (rootDir: backend).
services:
  - type: web
    name: virello-secure
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_TOKEN_SECRET
        generateValue: true
      - key: CHECKER_EMAIL
        sync: false
      - key: CHECKER_PASSWORD
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ACCESS_ROLE_ID
        sync: false
